<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader Agent</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--mute:#8b949e;--up:#26a69a;--down:#ef5350;--warn:#d29922;--ema1:#f0b90b;--ema2:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;font-weight:600}
.badge{padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute)}
.ok{color:var(--up);border-color:var(--up)}.bad{color:var(--down);border-color:var(--down)}.warn{color:var(--warn);border-color:var(--warn)}
main{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;padding:12px 16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
section h2{font-size:12px;margin:0 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
@media(max-width:1000px){.c8,.c6,.c4{grid-column:span 12}}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 10px;cursor:pointer;font:inherit}
button.on{border-color:var(--ema2);color:var(--ema2)}
#price,#equity{height:420px}#equity{height:260px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:400}
.scroll{max-height:300px;overflow:auto}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--up)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}.kv span:nth-child(odd){color:var(--mute)}
.mute{color:var(--mute)}.up{color:var(--up)}.down{color:var(--down)}
</style>
</head>
<body>
<header>
  <h1>Trader Agent</h1>
  <span class="badge" id="mode">paper · read-only</span>
  <span class="badge" id="kill">kill switch: ?</span>
  <span class="badge" id="halt">risk halt: ?</span>
  <span class="badge" id="ver"></span>
  <span class="badge mute" id="upd"></span>
</header>
<main>
  <section class="c8">
    <h2>Candles · EMA · 24h volume profile</h2>
    <div class="toolbar" id="tb"></div>
    <div id="price"></div>
    <div class="mute" id="profile"></div>
  </section>
  <section class="c4">
    <h2>Burn-in</h2>
    <div id="burn"></div>
    <h2 style="margin-top:14px">Risk &amp; paper account</h2>
    <div class="kv" id="acct"></div>
  </section>
  <section class="c6"><h2>Paper equity</h2><div id="equity"></div></section>
  <section class="c6"><h2>Positions</h2><div id="pos"></div><h2 style="margin-top:14px">Recent trades</h2><div class="scroll" id="trades"></div></section>
  <section class="c6"><h2>Stream health</h2><div class="scroll" id="streams"></div></section>
  <section class="c6"><h2>Decisions (proposal → critic)</h2><div class="scroll" id="dec"></div></section>
</main>
<script>
const REFRESH_MS = 15000;
const state = {symbol: null, res: "15", symbols: []};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d = 0) => n == null ? "–" : Number(n).toLocaleString("en-US", {maximumFractionDigits: d});
const when = ms => ms ? new Date(ms).toISOString().replace("T", " ").slice(5, 19) + "Z" : "–";
const ago = s => s == null ? "–" : s < 90 ? s + "s" : s < 5400 ? Math.round(s / 60) + "m" : (s / 3600).toFixed(1) + "h";
const get = async p => { const r = await fetch(p); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); };
const chartOpts = h => ({
  height: h, autoSize: true,
  layout: {background: {color: "#161b22"}, textColor: "#8b949e"},
  grid: {vertLines: {color: "#21262d"}, horzLines: {color: "#21262d"}},
  timeScale: {timeVisible: true, borderColor: "#30363d"}, rightPriceScale: {borderColor: "#30363d"},
});
const pc = LightweightCharts.createChart($("price"), chartOpts(420));
const cs = pc.addCandlestickSeries({upColor: "#26a69a", downColor: "#ef5350", wickUpColor: "#26a69a", wickDownColor: "#ef5350", borderVisible: false});
const e1 = pc.addLineSeries({color: "#f0b90b", lineWidth: 1, priceLineVisible: false, lastValueVisible: false});
const e2 = pc.addLineSeries({color: "#58a6ff", lineWidth: 1, priceLineVisible: false, lastValueVisible: false});
const vs = pc.addHistogramSeries({priceFormat: {type: "volume"}, priceScaleId: "vol", color: "#30363d"});
pc.priceScale("vol").applyOptions({scaleMargins: {top: .82, bottom: 0}});
const ec = LightweightCharts.createChart($("equity"), chartOpts(260));
const es = ec.addAreaSeries({lineColor: "#58a6ff", topColor: "rgba(88,166,255,.3)", bottomColor: "rgba(88,166,255,0)"});
let lines = [], fitted = "";

function badge(el, text, cls) { el.textContent = text; el.className = "badge " + cls; }

function renderToolbar() {
  const tb = $("tb"); tb.textContent = "";
  const add = (label, on, fn) => { const b = document.createElement("button"); b.textContent = label; if (on) b.className = "on"; b.onclick = fn; tb.appendChild(b); };
  state.symbols.forEach(s => add(s, s === state.symbol, () => { state.symbol = s; refreshChart(true); renderToolbar(); }));
  tb.appendChild(Object.assign(document.createElement("span"), {className: "mute", textContent: " | "}));
  [["15", "15m"], ["60", "1h"], ["D", "1d"]].forEach(([r, l]) => add(l, r === state.res, () => { state.res = r; refreshChart(true); renderToolbar(); }));
}

async function refreshOverview() {
  const o = await get("/api/overview");
  if (!state.symbols.length) { state.symbols = o.symbols; state.symbol = o.symbols[0]; renderToolbar(); refreshChart(true); }
  badge($("kill"), o.kill_switch ? "kill switch: ENGAGED" : "kill switch: off", o.kill_switch ? "bad" : "ok");
  $("ver").textContent = o.version + " · " + o.config_hash;
  const b = o.burnin;
  $("burn").innerHTML = b
    ? `<div class="bar"><i style="width:${(b.progress * 100).toFixed(1)}%"></i></div><div class="mute">${(b.progress * b.days).toFixed(2)} / ${b.days} days · ${b.done ? "complete" : "ends " + when(b.end_ms)}</div>`
    : '<span class="mute">BURNIN_START not set</span>';
  $("upd").textContent = "updated " + when(o.now_ms);
}

async function refreshChart(fit) {
  if (!state.symbol) return;
  const d = await get(`/api/candles?symbol=${state.symbol}&resolution=${state.res}&limit=400`);
  cs.setData(d.candles);
  vs.setData(d.candles.map(c => ({time: c.time, value: c.volume, color: c.close >= c.open ? "rgba(38,166,154,.35)" : "rgba(239,83,80,.35)"})));
  e1.setData(d.ema_fast.data); e2.setData(d.ema_slow.data);
  const times = new Set(d.candles.map(c => c.time));
  cs.setMarkers(d.markers.filter(m => times.has(m.time)).map(m => m.type === "entry"
    ? {time: m.time, position: "belowBar", color: "#26a69a", shape: "arrowUp", text: "entry"}
    : {time: m.time, position: "aboveBar", color: "#ef5350", shape: "arrowDown", text: "exit"}));
  lines.forEach(l => cs.removePriceLine(l)); lines = [];
  const p = d.profile;
  if (p) {
    [["VAH", p.vah, "#a371f7"], ["POC", p.poc, "#f0b90b"], ["VAL", p.val, "#a371f7"]].forEach(([title, price, color]) =>
      lines.push(cs.createPriceLine({price, color, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title})));
    $("profile").textContent = `24h profile (${p.source}): POC ${fmt(p.poc)} · VAH ${fmt(p.vah)} · VAL ${fmt(p.val)} · vol ${fmt(p.volume, 4)} · EMA ${d.ema_fast.period}/${d.ema_slow.period}`;
  } else $("profile").textContent = "no profile data";
  const key = state.symbol + state.res;
  if (fit || fitted !== key) { pc.timeScale().fitContent(); fitted = key; }
}

async function refreshPaper() {
  const p = await get("/api/paper");
  if (!p.available) {
    badge($("halt"), "risk halt: n/a", "");
    $("acct").innerHTML = '<span class="mute">no paper run yet</span>';
    $("pos").innerHTML = ""; $("trades").innerHTML = ""; es.setData([]);
    return;
  }
  badge($("halt"), p.halt_reason ? "risk halt: " + p.halt_reason : "risk halt: none", p.halt_reason ? "bad" : "ok");
  const cls = p.change_pct >= 0 ? "up" : "down";
  $("acct").innerHTML = [
    ["run", esc(p.run_id)], ["equity", fmt(p.equity)], ["change", `<span class="${cls}">${p.change_pct.toFixed(3)}%</span>`],
    ["cash", fmt(p.cash)], ["high water", fmt(p.high_water)], ["start of day", fmt(p.start_of_day)], ["risk day", esc(p.risk_day || "–")],
    ["kill switch", p.kill_switch ? '<span class="down">engaged</span>' : "off"],
  ].map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("");
  es.setData(p.curve); ec.timeScale().fitContent();
  $("pos").innerHTML = p.positions.length
    ? `<table><tr><th>symbol</th><th>amount</th><th>mark</th><th>value</th><th>stop</th></tr>${p.positions.map(x => `<tr><td>${esc(x.symbol)}</td><td>${esc(x.amount)}</td><td>${fmt(x.mark)}</td><td>${fmt(x.value)}</td><td>${fmt(x.stop)}</td></tr>`).join("")}</table>`
    : '<span class="mute">flat</span>';
  $("trades").innerHTML = p.trades.length
    ? `<table><tr><th>time</th><th>symbol</th><th>side</th><th>amount</th><th>price</th><th>reason</th></tr>${p.trades.map(t => `<tr><td>${when(t.at_ms)}</td><td>${esc(t.symbol)}</td><td class="${t.side === "buy" ? "up" : "down"}">${esc(t.side)}</td><td>${esc(t.amount)}</td><td>${fmt(t.price)}</td><td>${esc(t.reason)}</td></tr>`).join("")}</table>`
    : '<span class="mute">no trades</span>';
}

async function refreshStreams() {
  const s = await get("/api/streams");
  if (!s.available) { $("streams").innerHTML = '<span class="mute">no streams.json</span>'; return; }
  $("streams").innerHTML = `<div class="mute">reconnects: ${s.reconnects} · file updated ${when(s.updated_ms)}</div><table><tr><th>channel</th><th>messages</th><th>gaps</th><th>lost</th><th>last msg</th></tr>${s.channels.map(c => {
    const stale = c.age_s == null || c.age_s > (c.channel.includes("orderbook") ? 120 : 900);
    return `<tr><td>${esc(c.channel.replace("public:", ""))}</td><td>${fmt(c.messages)}</td><td class="${c.gaps ? "down" : ""}">${c.gaps}</td><td>${c.lost}</td><td class="${stale ? "down" : "up"}">${ago(c.age_s)}</td></tr>`;
  }).join("")}</table>`;
}

async function refreshDecisions() {
  const d = await get("/api/decisions?limit=60");
  if (!d.available || !d.decisions.length) { $("dec").innerHTML = '<span class="mute">no decisions yet</span>'; return; }
  const brief = v => v == null ? "" : esc(typeof v === "string" ? v : JSON.stringify(v));
  $("dec").innerHTML = `<table><tr><th>time</th><th>symbol</th><th>signal</th><th>proposal</th><th>critic</th><th>action</th></tr>${d.decisions.map(x => `<tr><td>${when(x.at_ms)}</td><td>${esc(x.symbol)}</td><td>${x.signal ? esc(x.signal.type) : '<span class="mute">' + (x.data_ok ? "none" : "data stale") + "</span>"}</td><td>${brief(x.proposal)}</td><td>${brief(x.critic)}</td><td>${brief(x.action)}</td></tr>`).join("")}</table>`;
}

async function tick() {
  const jobs = [refreshOverview, () => refreshChart(false), refreshPaper, refreshStreams, refreshDecisions];
  await Promise.allSettled(jobs.map(j => j()));
}
tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
